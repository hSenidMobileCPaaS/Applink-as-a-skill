description = "Review Applink integration code for money, credential and compliance bugs"
prompt = "Review this project's Applink integration using the applink-review skill. Run `node tools/applink.mjs practices` and check every one against the code. Pay particular attention to the charging path: P1003 must not be treated as a completed charge, OTP generation must never be re-run to retry a verification, and externalTrxId must be persisted before the first call. Report findings with file:line, most severe first, each with the evidence and the specific fix. Finish with a plain verdict on whether this is safe to put in front of real subscribers."
