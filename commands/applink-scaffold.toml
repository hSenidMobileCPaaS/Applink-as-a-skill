description = "Scaffold a new Applink integration — config, client, types, callbacks"
prompt = "Scaffold an Applink integration for: {{args}}. Follow the applink-scaffold skill. Write it in this project's existing language and framework — Applink is JSON over HTTPS and templates/ ships working code for TypeScript/Node, Python, Java, Go, PHP and C#, with references/11-any-stack.md covering anything else. Never add a second runtime for this. Build in order: (1) .env plus .env.example plus a config module that validates at startup, so no credential can land in source, and that refuses to boot with only one of the two CaaS URLs set; (2) one client with a single post() helper that injects credentials, sets a timeout, and branches on statusCode — with charging as TWO wrappers, startCharge() then confirmCharge(), because P1003 only means an OTP was sent; (3) the callback handlers, which acknowledge before doing work, deduplicate, and strip the password the subscriber notification carries. Get every contract from `node tools/applink.mjs show <id>`."
