description = "Implement or fix Applink inbound webhooks"
prompt = "Work on Applink callbacks: {{args}}. Run `node tools/applink.mjs list --direction=inbound` and `node tools/applink.mjs show <id>` for each. Every handler must return HTTP 200 with {\"statusCode\":\"S1000\",\"statusDetail\":\"Success\"}, acknowledge before doing work, deduplicate on the documented key, validate the schema, and verify applicationId where the payload carries it (the delivery report and the charging notification do not). The subscriber notification contains your password — strip it before anything is logged. The charging notification is the only place a charge is settled, so match on externalTrxId and treat a non-zero balanceDue as a partial payment. Test with ./scripts/test-callbacks.sh."
