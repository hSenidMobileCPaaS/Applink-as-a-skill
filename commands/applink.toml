description = "Work on an Applink integration (SMS, USSD, Subscription, OTP, CaaS charging)"
prompt = "Use the Applink skill for this task. Applink is hSenid Mobile's Bangladesh telco platform, on the Banglalink network, charging in BDT. Before writing code, query the contract rather than recalling it: run `node tools/applink.mjs list` and `node tools/applink.mjs show <id>` for each service involved. Non-negotiable: credentials come from environment variables and are never in source, a client bundle, or a log; Applink is called from the backend only; branch on statusCode because HTTP 200 does not mean success; P1003 from /caas/direct/debit means an OTP was sent and NOTHING has been charged, so the charge completes at /caas/otp/verify and settles on the charging-notification callback; charging is idempotent on externalTrxId and OTP generation is never re-run to retry a verification. Applink publishes no benign duplicate-state codes, no LBS, no IVR and no getStatus endpoint — do not invent them. Write the integration in whatever language this project already uses — templates/ covers TypeScript/Node, Python, Java, Go, PHP and C#, and references/11-any-stack.md specifies the same integration for any other stack. Task: {{args}}"
