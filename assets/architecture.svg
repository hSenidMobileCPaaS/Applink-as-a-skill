<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img"
     aria-label="Architecture: a browser or mobile client calls your backend; your backend holds the credentials and calls the Applink platform over HTTPS from a static allow-listed IP; Applink delivers to subscribers over the Banglalink network in Bangladesh and posts five callbacks back to your backend, including the charging notification that settles every charge. Credentials never cross the trust boundary to the client.">
  <style>
    .box   { fill: #ffffff; stroke: #CBD5E1; stroke-width: 1.5; rx: 12; }
    .accent{ fill: #FFF4ED; stroke: #F16724; stroke-width: 2; }
    .warn  { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; }
    .t     { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
    .s     { font: 400 12.5px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    .m     { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #C2410C; }
    .lbl   { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    .flow  { stroke: #F16724; stroke-width: 2; fill: none; marker-end: url(#a); }
    .back  { stroke: #7C3AED; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#b); }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #111827; stroke: #374151; }
      .accent{ fill: #2A1408; stroke: #FB923C; }
      .warn  { fill: #2A1214; stroke: #F87171; }
      .t     { fill: #F1F5F9; }
      .s     { fill: #94A3B8; }
      .m     { fill: #FDBA74; }
      .lbl   { fill: #94A3B8; }
      .flow  { stroke: #FB923C; marker-end: url(#ad); }
      .back  { stroke: #A78BFA; marker-end: url(#bd); }
    }
  </style>
  <defs>
    <marker id="a"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#F16724"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#FB923C"/></marker>
    <marker id="b"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#7C3AED"/></marker>
    <marker id="bd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#A78BFA"/></marker>
  </defs>

  <!-- Client -->
  <rect class="box" x="20" y="150" width="170" height="104" rx="12"/>
  <text class="t" x="105" y="182" text-anchor="middle">Browser / Mobile app</text>
  <text class="s" x="105" y="204" text-anchor="middle">your own auth</text>
  <text class="s" x="105" y="224" text-anchor="middle">no Applink credentials</text>

  <!-- Your backend -->
  <rect class="accent" x="290" y="120" width="230" height="164" rx="12"/>
  <text class="t" x="405" y="150" text-anchor="middle">Your backend</text>
  <text class="m" x="405" y="176" text-anchor="middle">APPLINK_APP_ID</text>
  <text class="m" x="405" y="196" text-anchor="middle">APPLINK_PASSWORD</text>
  <text class="s" x="405" y="222" text-anchor="middle">static, allow-listed egress IP</text>
  <text class="s" x="405" y="242" text-anchor="middle">5 callback routes</text>
  <text class="s" x="405" y="262" text-anchor="middle">branches on statusCode</text>

  <!-- Applink -->
  <rect class="box" x="620" y="120" width="250" height="164" rx="12"/>
  <text class="t" x="745" y="150" text-anchor="middle">Applink platform</text>
  <text class="m" x="745" y="174" text-anchor="middle">api.applink.com.bd</text>
  <text class="s" x="745" y="200" text-anchor="middle">SMS · USSD · Subscription</text>
  <text class="s" x="745" y="220" text-anchor="middle">OTP · CaaS charging (BDT)</text>
  <text class="s" x="745" y="252" text-anchor="middle">Banglalink, Bangladesh</text>
  <text class="s" x="745" y="272" text-anchor="middle">→ subscribers</text>

  <!-- Flows -->
  <path class="flow" d="M190 190 L286 190"/>
  <text class="lbl" x="238" y="180" text-anchor="middle">HTTPS</text>

  <path class="flow" d="M520 168 L616 168"/>
  <text class="lbl" x="568" y="158" text-anchor="middle">outbound</text>

  <path class="back" d="M616 236 L524 236"/>
  <text class="lbl" x="570" y="256" text-anchor="middle">callbacks</text>

  <!-- Charging note -->
  <rect class="box" x="290" y="316" width="580" height="52" rx="10"/>
  <text class="s" x="580" y="338" text-anchor="middle">A charge is two calls plus a callback: /caas/direct/debit sends an OTP (P1003) →</text>
  <text class="s" x="580" y="357" text-anchor="middle">/caas/otp/verify moves the money → the charging notification says what was paid.</text>

  <!-- The rule -->
  <rect class="warn" x="290" y="380" width="580" height="62" rx="10"/>
  <text class="t" x="580" y="404" text-anchor="middle">Credentials never cross the dashed line to the left.</text>
  <text class="s" x="580" y="426" text-anchor="middle">No Applink call is ever made from client-side code — IP allow-listing cannot be satisfied there, and the password can charge your subscribers.</text>

  <path d="M240 120 L240 452" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.6"/>
  <text class="lbl" x="240" y="112" text-anchor="middle">trust boundary</text>
</svg>
